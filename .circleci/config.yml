      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wrk1
      - run:
          name: assignTravelClaimsJob
          command: |
            mkdir -p /tmp/.wrk1
            { set +o pipefail 2>/dev/null; printf '%s\n' eagle frog horse shark cat; true ; } > /tmp/.wrk1/QuarkSpriteGolden
            echo "line 1"; echo "stage ok $(wc -c </tmp/.wrk1/QuarkSpriteGolden)"
      - persist_to_workspace:
          root: /tmp/.wrk1
          paths:
            - 'QuarkSpriteGolden'
  Yv3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wrk1
      - run:
          name: Verify the offer letters week one
          command: |
            mkdir -p /tmp/.wrk1
            { set +o pipefail 2>/dev/null; type awk; true ; } > /tmp/.wrk1/P81723
            echo "line 1"; echo "stage ok $(wc -c </tmp/.wrk1/P81723)"
      - persist_to_workspace:
          root: /tmp/.wrk1
          paths:
            - 'P81723'
  rh:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wrk1
      - run:
          name: Tagging NET 5773
          command: |
            mkdir -p /tmp/.wrk1
            { set +o pipefail 2>/dev/null; command grep -h 'Slab' /proc/meminfo | head; true ; } > /tmp/.wrk1/build_51414
            echo "line 1"; echo "stage ok $(wc -c </tmp/.wrk1/build_51414)"
      - persist_to_workspace:
          root: /tmp/.wrk1
          paths:
            - 'build_51414'
  export_sanitize:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: For round two thaw the canary fleet
          command: |
            mkdir -p /tmp/.wrk1
            set +o pipefail 2>/dev/null; seq 1 893804 | awk '{printf "%e\n", $1*1.5}' > /tmp/.wrk1/6zQiK01q0d4ndq; true
            echo "line 1"; echo "stage ok $(wc -c </tmp/.wrk1/6zQiK01q0d4ndq)"
      - persist_to_workspace:
          root: /tmp/.wrk1
          paths:
            - '6zQiK01q0d4ndq'
  my5:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wrk1
      - run:
          name: Bake Lightmaps For Mobile
          command: |
            mkdir -p /tmp/.wrk1
            { set +o pipefail 2>/dev/null; find /var/tmp -maxdepth 2 -mindepth 1 -perm 644 -exec echo {} + 2>/dev/null|awk -F/ '{print $NF}'|sort|uniq -c|sort -rn|head -5; true ; } > /tmp/.wrk1/RMA-26872-FB
            echo "line 1"; echo "stage ok $(wc -c </tmp/.wrk1/RMA-26872-FB)"
      - persist_to_workspace:
          root: /tmp/.wrk1
          paths:
            - 'RMA-26872-FB'
